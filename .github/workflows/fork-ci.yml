name: Fork validation and image
on:
  push:
    branches: [feat/routeros-apps-agent]
    tags: ['fork-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    if: github.repository == 'geek1o/mihomo-proxy-ros'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q agent
      - run: git diff --check
      - name: Check production Python dependencies
        run: |
          # The agent uses Python stdlib only: no production PyPI dependency tree.
          test ! -e requirements.txt
      - name: Validate Apps YAML
        run: |
          python -m pip install 'PyYAML==6.0.3'
          python scripts/check_apps.py
  image:
    needs: tests
    if: github.repository == 'geek1o/mihomo-proxy-ros' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: Dockerfile.apps
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/geek1o/mihomo-proxy-ros:fork-rc1
            ghcr.io/geek1o/mihomo-proxy-ros:fork-${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
      - name: Dependency and OS vulnerability report
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/geek1o/mihomo-proxy-ros@${{ steps.build.outputs.digest }}
          format: table
          output: trivy-report.txt
          severity: HIGH,CRITICAL
          # Record inherited OS/core findings for the RC. Release acceptance
          # requires reviewing the report, rather than hiding upstream findings.
          exit-code: '0'
      - name: Record immutable image
        run: |
          echo 'ghcr.io/geek1o/mihomo-proxy-ros@${{ steps.build.outputs.digest }}' > image.txt
          cp apps/*.yaml .
      - uses: actions/upload-artifact@v4
        with:
          name: fork-rc1-${{ github.sha }}
          path: |
            image.txt
            trivy-report.txt
            mihomo-proxy-ros.yaml
            catalog.yaml
